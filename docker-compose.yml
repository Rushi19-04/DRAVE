version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - saas/backend/.env
    environment:
      POSTGRES_USER: drave
      POSTGRES_DB: drave_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drave -d drave_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
