query: |
  title: Suspicious Admin Activity (LocalGroup Add)
  id: 33333333-3333-3333-3333-333333333333
  status: test
  logsource:
      category: process_creation
      product: windows
  detection:
      selection:
          Image|endswith: '\net.exe'
          CommandLine|contains|all:
