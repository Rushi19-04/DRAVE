id: 22222222-2222-2222-2222-222222222222
name: Credential Access (LSASS Dump via ProcDump)
description: Detects dumping of lsass.exe memory using Sysinternals ProcDump.
language: sigma
platform: windows
severity: high
author: drave-demo
created_at: 2025-01-01T00:00:00Z
updated_at: 2025-01-01T00:00:00Z
attack_mappings:
  - T1003.001
query: |
  title: Credential Access (LSASS Dump via ProcDump)
  id: 22222222-2222-2222-2222-222222222222
  status: test
  logsource:
      category: process_creation
      product: windows
  detection:
      selection:
          Image|endswith: '\procdump.exe'
          CommandLine|contains|all:
              - '-ma'
              - 'lsass'
      condition: selection
  level: high
