id: af4a3d12-2b5e-4c6d-8e7f-1a2b3c4d5e6f
name: Encoded PowerShell Command Line
description: Detects execution of PowerShell with Base64-encoded command line.
language: sigma
platform: windows
severity: high
author: drave-demo
created_at: 2025-01-01T00:00:00Z
updated_at: 2025-06-01T00:00:00Z
attack_mappings:
  - T1059.001
query: |
  title: Encoded PowerShell Command Line
  id: af4a3d12-2b5e-4c6d-8e7f-1a2b3c4d5e6f
  status: test
  logsource:
      category: process_creation
      product: windows
  detection:
      selection_process:
          Image|endswith:
              - '\powershell.exe'
              - '\pwsh.exe'
      selection_encoded:
          CommandLine|contains:
              - '-enc'
              - '-EncodedCommand'
              - '-ec '
      condition: selection_process and selection_encoded
  level: high
