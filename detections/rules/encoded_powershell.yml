id: af4a3d12-2b5e-4c6d-8e7f-1a2b3c4d5e6f
version: 2
name: Encoded PowerShell Command Line
description: Detects base64 encoded PowerShell commands often used in malicious activity.
language: sigma
platform: windows
severity: high
author: drave-demo
created_at: 2025-01-01T00:00:00Z
updated_at: 2025-06-01T00:00:00Z
attack_mappings:
  - T1059.001
known_limitations: >
  The rule does not catch the '-e' shorthand for -EncodedCommand. PowerShell accepts
  any unambiguous prefix of the parameter name, so '-e', '-en', and '-enc' are all valid.
  This rule only covers '-enc', '-EncodedCommand', and '-ec '. Adding '-e' would risk
  false positives on other parameters starting with 'e'. See variation_04 in the
  robustness fixtures for a concrete evasion example.
query: |
  title: Encoded PowerShell Command Line
  id: af4a3d12-2b5e-4c6d-8e7f-1a2b3c4d5e6f
  status: test
  logsource:
      category: process_creation
      product: windows
  detection:
      selection_process:
          Image|endswith:
              - '\powershell.exe'
              - '\pwsh.exe'
      selection_encoded:
          CommandLine|contains:
              - '-enc'
              - '-EncodedCommand'
              - '-ec '
      condition: selection_process and selection_encoded
  level: high
